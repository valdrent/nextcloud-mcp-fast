name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve image tags
        id: tags
        run: |
          TAGS="ghcr.io/valdrent/nextcloud-mcp-fast:${{ github.ref_name }}"
          # Only push latest for non-prerelease tags (no '-' in tag)
          if ! echo "${{ github.ref_name }}" | grep -q '-'; then
            TAGS="$TAGS
            ghcr.io/valdrent/nextcloud-mcp-fast:latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max

      - name: Sign image with cosign
        run: |
          cosign sign --yes "ghcr.io/valdrent/nextcloud-mcp-fast@${{ steps.build.outputs.digest }}"

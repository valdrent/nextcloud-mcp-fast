name: Feature request
description: Propose a new capability or an improvement.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and footprint impact
      description: Does this widen what an LLM can do, add dependencies, or increase memory usage?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
